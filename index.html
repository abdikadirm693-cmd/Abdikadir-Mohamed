    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <script>
      // Suppress benign Vite dev-server HMR WebSocket rejection in iframe preview environment
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = reason && (reason.message || String(reason));
        var stack = reason && (reason.stack || '');
        if (
          msg === 'WebSocket closed without opened.' ||
          (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://'))) ||
          stack.includes('@vite/client')
        ) {
          event.preventDefault();
          event.stopPropagation();
          return false;
        }
      }, true);
      window.addEventListener('error', function (event) {
        var filename = event.filename || '';
        var msg = event.message || '';
        if (
          filename.includes('@vite/client') ||
          (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://')))
        ) {
          event.preventDefault();
          event.stopPropagation();
          return false;
        }
      }, true);
    </script>
